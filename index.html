<head>

    <meta name="theme-color" content="#ffffff">
    <title>Oleksandr Harazha PHP Developer CV</title>
    <meta name="description" content="CV of Oleksandr Harazha, Junior PHP / Laravel Developer. PHP solutions for business with an SEO mindset: skills, pet projects, contacts and a downloadable resume.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23222'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='15' font-weight='700' fill='%23fff' text-anchor='middle'%3ECV%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,200..900;1,200..900&family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&display=swap" rel="stylesheet">
    <link rel="alternate" type="text/markdown" href="./cv.md" title="This CV as plain text">
    <!--
        The plain-text CV (#cv-text, added at build time) is for AI tools and crawlers that
        don't run JavaScript. When JavaScript works, the React app shows the CV instead, so
        the plain copy is visually hidden here, before anything is painted (no flash).
    -->
    <script>document.documentElement.classList.add('js')</script>
    <style>.js #cv-text { position: absolute; top: 0; left: 0; width: 1px; height: 1px; padding: 0; margin: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }</style>
</head>
<body>
    <!-- React renders the whole CV into this div (see src/main.jsx) -->
    <div id="root"></div>

    <!-- static-cv -->

    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
