<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Oleksandr Harazha PHP Developer CV</title>
    <meta name="description" content="CV of Oleksandr Harazha, Junior PHP / Laravel Developer. PHP solutions for business with an SEO mindset: skills, pet projects, contacts and a downloadable resume.">
    <!--
        Link preview (Telegram, LinkedIn, WhatsApp, Slack...): Open Graph + Twitter card.
        URLs here must be absolute. The image is public/media/images/og-preview.jpg (1200x630).
        After changing it, refresh old previews: Telegram @WebpageBot, LinkedIn Post Inspector.
    -->
    <meta property="og:type" content="profile">
    <meta property="og:site_name" content="Oleksandr Harazha CV">
    <meta property="og:url" content="https://devalexmuha.github.io/php-cv/">
    <meta property="og:title" content="Oleksandr Harazha – Junior PHP / Laravel Developer">
    <meta property="og:description" content="PHP solutions for business with an SEO mindset: skills, pet projects, contacts and a downloadable resume.">
    <meta property="og:image" content="https://devalexmuha.github.io/php-cv/media/images/og-preview.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Oleksandr Harazha, Junior PHP / Laravel Developer: photo and CV title">
    <meta property="profile:first_name" content="Oleksandr">
    <meta property="profile:last_name" content="Harazha">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23222'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='15' font-weight='700' fill='%23fff' text-anchor='middle'%3ECV%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,200..900;1,200..900&family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&display=swap" rel="stylesheet">
    <link rel="alternate" type="text/markdown" href="./cv.md" title="This CV as plain text">
    <!--
        The plain-text CV (#cv-text, added at build time) is for AI tools and crawlers that
        don't run JavaScript. When JavaScript works, the React app shows the CV instead, so
        the plain copy is visually hidden here, before anything is painted (no flash).
    -->
    <script>document.documentElement.classList.add('js')</script>
    <style>.js #cv-text { position: absolute; top: 0; left: 0; width: 1px; height: 1px; padding: 0; margin: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }</style>
</head>
<body>
    <!-- React renders the whole CV into this div (see src/main.jsx) -->
    <div id="root"></div>

    <!-- static-cv -->

    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
